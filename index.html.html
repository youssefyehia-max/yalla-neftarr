        let orders = [];

        window.onload = function() {
            populateMenuDropdown();
            listenToLiveUpdates();
            listenToConfigUpdates();
            onItemSelectionChange();
        };

        function populateMenuDropdown() {
            const select = document.getElementById('itemSelect');
            select.innerHTML = '';
            
            const categories = [...new Set(menuItems.map(i => i.category))];
            categories.forEach(cat => {
                const group = document.createElement('optgroup');
                group.label = cat;
                menuItems.filter(i => i.category === cat).forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = JSON.stringify(item);
                    opt.textContent = item.name;
                    group.appendChild(opt);
                });
                select.appendChild(group);
            });
        }

        function onItemSelectionChange() {
            const select = document.getElementById('itemSelect');
            if (!select.value) return;
            const item = JSON.parse(select.value);
            
            // Auto-fill price if previously remembered
            if (savedItemPrices[item.name]) {
                document.getElementById('itemPrice').value = savedItemPrices[item.name];
            } else {
                document.getElementById('itemPrice').value = '';
            }
        }

        function listenToLiveUpdates() {
            dbOrdersRef.onSnapshot((snapshot) => {
                orders = [];
                snapshot.forEach((doc) => {
                    orders.push({ id: doc.id, ...doc.data() });
                });
                updateCalculations();
            });
        }

        function listenToConfigUpdates() {
            dbConfigRef.onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.restaurantName) document.getElementById('restaurantName').value = data.restaurantName;
                    if (data.payerName) document.getElementById('payerName').value = data.payerName;
                    if (data.instapayAccount) document.getElementById('instapayAccount').value = data.instapayAccount;
                    if (data.deliveryFee) document.getElementById('deliveryFee').value = data.deliveryFee;
                    if (data.savedItemPrices) savedItemPrices = data.savedItemPrices;
                    updateCalculations();
                }
            });
        }

        function saveConfig() {
            const configData = {
                restaurantName: document.getElementById('restaurantName').value,
                payerName: document.getElementById('payerName').value,
                instapayAccount: document.getElementById('instapayAccount').value,
                deliveryFee: parseFloat(document.getElementById('deliveryFee').value) || 0,
                savedItemPrices: savedItemPrices
            };
            dbConfigRef.set(configData, { merge: true });
        }

        function addNoteTag(tagText) {
            const notesInput = document.getElementById('itemNotes');
            if (notesInput.value.trim() === '') {
                notesInput.value = tagText;
            } else {
                notesInput.value += ` ، ${tagText}`;
            }
        }

            const priceInput = document.getElementById('itemPrice');
            const breadInput = document.querySelector('input[name="breadType"]:checked');
            const notesInput = document.getElementById('itemNotes');

            if (!name) {
                alert('برجاء كتابة اسمك أولاً');
                return;
            }

            if (!select.value) return;

            const selectedItem = JSON.parse(select.value);
            const qty = parseInt(qtyInput.value) || 1;
            const price = parseFloat(priceInput.value) || 0;
            const bread = breadInput ? breadInput.value : 'بلدي';
            const notes = notesInput.value.trim();

            // Save price to memory if provided
            if (price > 0) {
                savedItemPrices[selectedItem.name] = price;
                saveConfig();
            }

            const newItem = {
                name: selectedItem.name,
                price: price,
                qty: qty,
                bread: bread,
                notes: notes,
                total: price * qty
            };

            let existingOrder = orders.find(o => o.name.toLowerCase() === name.toLowerCase());

            if (existingOrder) {
                let updatedItems = [...existingOrder.items, newItem];
                let updatedCost = (existingOrder.foodCost || 0) + newItem.total;
                dbOrdersRef.doc(existingOrder.id).update({
                    items: updatedItems,
                    foodCost: updatedCost
                });
            } else {
                let newDocId = Date.now().toString();
                dbOrdersRef.doc(newDocId).set({
                    name: name,
                    items: [newItem],
                    foodCost: newItem.total,
                    isPaid: false
                });
            }

            notesInput.value = '';
            priceInput.value = '';
        }

        function updateItemPriceInOrder(orderId, itemIndex) {
            const order = orders.find(o => o.id === orderId);
            if (!order || !order.items[itemIndex]) return;

            const currentPrice = order.items[itemIndex].price || 0;
            const newPriceStr = prompt(`أدخل سعر (${order.items[itemIndex].name}):`, currentPrice);

            if (newPriceStr !== null) {
                const newPrice = parseFloat(newPriceStr) || 0;
                
                // Update memory
                if (newPrice > 0) {
                    savedItemPrices[order.items[itemIndex].name] = newPrice;
                    saveConfig();
                }

                order.items[itemIndex].price = newPrice;
                order.items[itemIndex].total = newPrice * order.items[itemIndex].qty;

                const newFoodCost = order.items.reduce((sum, i) => sum + i.total, 0);

                dbOrdersRef.doc(orderId).update({
                    items: order.items,
                    foodCost: newFoodCost
                });
            }
        }

        function updateCalculations() {
            const deliveryFee = parseFloat(document.getElementById('deliveryFee').value) || 0;
            const instapay = document.getElementById('instapayAccount').value.trim() || 'غير محدد';
            const peopleCount = orders.length;
            const deliveryPerPerson = peopleCount > 0 ? (deliveryFee / peopleCount) : 0;

            let totalFood = 0;

            orders.forEach(order => {
                order.deliveryCost = deliveryPerPerson;
                order.totalCost = (order.foodCost || 0) + deliveryPerPerson;
                totalFood += (order.foodCost || 0);
            });

            document.getElementById('instapayText').textContent = instapay;
            document.getElementById('peopleCountBadge').textContent = `المشاركين: ${peopleCount}`;
            document.getElementById('grandTotal').textContent = `${(totalFood + (peopleCount > 0 ? deliveryFee : 0)).toFixed(2)} جم`;
            document.getElementById('perPersonDelivery').textContent = `${deliveryPerPerson.toFixed(2)} جم`;

            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('ordersTableBody');
            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-gray-400">لا توجد طلبات مسجلة حتى الآن</td></tr>`;
                return;
            }

            tbody.innerHTML = orders.map(order => `
                <tr class="hover:bg-gray-50 border-b">
                    <td class="p-2.5 font-bold text-gray-900">${order.name}</td>
                    <td class="p-2.5 space-y-1">
                        ${order.items.map((i, idx) => `
                            <div class="flex items-center justify-between border-b border-gray-100 pb-1">
                                <div>
                                    <span class="font-semibold text-gray-800">• ${i.qty} ${i.name} (${i.bread})</span>
                                    ${i.notes ? `<span class="text-[10px] text-amber-700 block mr-1"> ↳ ملاحظة: ${i.notes}</span>` : ''}
                                </div>
                                <div class="flex items-center gap-1.5">
                                    <span class="text-xs font-bold text-gray-700">${i.price ? `${i.price} جم` : '<span class="text-red-500 font-normal text-[10px]">بدون سعر</span>'}</span>
                                    <button onclick="updateItemPriceInOrder('${order.id}', ${idx})" class="text-indigo-600 hover:text-indigo-900 text-xs px-1" title="تعديل السعر">
                                        <i class="fa-solid fa-pen"></i>
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </td>
                    <td class="p-2.5 font-extrabold text-thndr-dark">${(order.totalCost || 0).toFixed(2)} جم</td>
                    <td class="p-2.5">
                        <button onclick="togglePaid('${order.id}')" class="px-2 py-0.5 rounded-full text-[10px] font-bold ${order.isPaid ? 'bg-green-100 text-green-800 border border-green-300' : 'bg-amber-100 text-amber-800 border border-amber-300'}">
                            ${order.isPaid ? 'تم ✓' : 'لم يدفع'}
                        </button>
                    </td>
                    <td class="p-2.5 text-center">
                        <button onclick="deleteOrder('${order.id}')" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function togglePaid(id) {
            const order = orders.find(o => o.id === id);
            if (order) {
                dbOrdersRef.doc(id).update({ isPaid: !order.isPaid });
            }
        }

        function deleteOrder(id) {
            dbOrdersRef.doc(id).delete();
        }

        function clearAllOrders() {
            if (confirm("هل أنت تأكد من مسح جميع طلبات اليوم لبدء يوم جديد؟")) {
                orders.forEach(o => {
                    dbOrdersRef.doc(o.id).delete();
                });
            }
        }

        function toggleMenuEditor() {
            document.getElementById('menuEditorSection').classList.toggle('hidden');
        }

        function addNewMenuItem() {
            const cat = document.getElementById('newItemCategory').value.trim() || 'عام';
            const name = document.getElementById('newItemName').value.trim();

            if (!name) {
                alert('برجاء كتابة اسم الصنف');
                return;
            }

            menuItems.push({ category: cat, name: name });
            populateMenuDropdown();

            document.getElementById('newItemName').value = '';
            alert(`تمت إضافة "${name}" للمنيو بنجاح!`);
        }

        function exportToRestaurantWhatsApp() {
            if (orders.length === 0) {
                alert('لا توجد طلبات لإرسالها للمطعم!');
                return;
            }

            const restaurant = document.getElementById('restaurantName').value || 'المطعم';

            let text = `🥪 *أوردر فطار - ${restaurant}*\n`;
            text += `-----------------------------------\n\n`;

            orders.forEach(o => {
                text += `👤 *${o.name}*:\n`;
                o.items.forEach(i => {
                    text += `   - ${i.qty} ${i.name} (عيش ${i.bread})`;
                    if (i.notes) text += ` [ملاحظة: ${i.notes}]`;
                    text += `\n`;
                });
                text += `\n`;
            });

            navigator.clipboard.writeText(text);
            alert('تم نسخ أوردر المطعم بنجاح (الأسماء والتفاصيل فقط)! يمكنك الآن لصقه في شات المطعم على الواتساب.');
        }
    </script>
</body>
